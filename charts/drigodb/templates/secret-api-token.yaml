{{/*
The bearer token every API call carries.

GENERATED ONCE AND PRESERVED, which has to be deliberate. A template that simply
called randAlphaNum would mint a new token on every `helm upgrade` — and under a
reconciler syncing continuously, on every sync — invalidating every consumer's
credential each time. The lookup reads what is already in the cluster and keeps
it.

lookup returns nothing during `helm template` and `--dry-run`, so a rendered
manifest shows a fresh value. That is correct: there is no cluster to read, and
nothing is being installed.

Rotating it is deliberate too — delete the Secret and upgrade, or set
api.token explicitly.
*/}}
{{- $name := printf "%s-token" (include "drigodb.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := .Values.api.token -}}
{{- if not $token -}}
  {{- if $existing -}}
    {{- $token = index $existing.data "token" | b64dec -}}
  {{- else -}}
    {{- $token = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
