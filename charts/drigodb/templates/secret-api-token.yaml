{{/*
The bearer token every API call carries.

THE CHART DOES NOT GENERATE THIS, and that is the point rather than an omission.

It used to, using Helm's `lookup` to read the live Secret and preserve the value
across upgrades. `lookup` only resolves when rendering against a cluster, so the
chart rendered differently depending on who rendered it — and Argo CD, which
renders with `helm template` and has no cluster context, took the random
fallback on every sync. Measured on kind: three hard refreshes, three different
tokens, and Argo reporting `Synced` and healthy throughout, because once the new
value is applied live matches desired and there is nothing to report. Every
consumer's credential rotated, silently, by a tool whose job is to notice drift.

That is a chart bug, not an Argo one. `helm diff`, `helm template` in CI and
kustomize's Helm inflator all render without a cluster too. A chart that only
behaves correctly under one renderer is broken, and this one is installed by
people who chose their reconciler before they had heard of drigodb.

So the chart is a pure function of its values. Supplying the token is the
installer's job, where querying a cluster is legitimate — see scripts/deploy.sh.

Issue #62 removes the question entirely by having drigodb issue its own tokens.
*/}}
{{- if and (not .Values.api.existingSecret) (not .Values.api.token) -}}
{{- fail "\n\ndrigodb needs an API token, and the chart will not invent one.\n\n  api.existingSecret  the name of a Secret with a `token` key — the right answer\n                      for anything real, and where SOPS or External Secrets fit\n  api.token           an explicit value, for kind and for trying it out\n\nscripts/deploy.sh creates one for you if it does not exist yet.\n" -}}
{{- end -}}
{{- if .Values.api.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drigodb.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.api.token | quote }}
{{- end -}}
