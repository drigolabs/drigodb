{{/*
Nothing here any more.

Every hosted database used to mount postgresql.conf, pg_hba.conf, bootstrap.sh
and a set of migrations. CloudNativePG owns the pod now — decision 0004 — so the
server configuration is fields on the Cluster spec, and drigodb no longer puts a
schema inside a database it hosts.

Kept as a file rather than deleted so the next person to ask "where did the
config go" finds this instead of a gap.
*/}}
