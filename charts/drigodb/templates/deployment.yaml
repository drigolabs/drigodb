apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "drigodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drigodb.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls the API when the data-plane config changes, so a database
        # provisioned after an upgrade gets the config the upgrade shipped.
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "drigodb.fullname" . }}
      containers:
        - name: api
          image: {{ include "drigodb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DRIGODB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "drigodb.tokenSecret" . }}
                  key: token
            - name: DRIGODB_DATABASE_NAMESPACE
              value: {{ .Values.databaseNamespace | quote }}
            - name: DRIGODB_STORAGE_CLASS
              # Empty means the cluster's default. The provisioner omits the
              # field entirely rather than sending "", which would mean
              # something else — no storage class at all.
              value: {{ .Values.database.storageClass | quote }}
            - name: DRIGODB_DEFAULT_TIER
              value: {{ .Values.database.defaultTier | quote }}
            - name: DRIGODB_MAX_TIER
              value: {{ .Values.database.maxTier | quote }}
            - name: DRIGODB_PG_IMAGE
              value: {{ .Values.database.image | quote }}
            - name: DRIGODB_ENDPOINT_SUFFIX
              value: {{ .Values.database.endpointSuffix | quote }}
            # Server authentication. Empty issuer means the feature is off, which
            # is what makes the URI say require rather than verify-full.
            - name: DRIGODB_TLS_ISSUER
              value: {{ if .Values.tls.certManager.enabled }}{{ include "drigodb.issuerName" . }}{{ else }}""{{ end }}
            - name: DRIGODB_TLS_ISSUER_KIND
              value: {{ if .Values.tls.certManager.enabled }}{{ include "drigodb.issuerKind" . }}{{ else }}""{{ end }}
            - name: DRIGODB_TLS_ISSUER_NAMESPACE
              value: {{ .Values.databaseNamespace | quote }}
            - name: DRIGODB_TLS_DURATION
              value: {{ .Values.tls.certManager.duration | quote }}
            - name: DRIGODB_TLS_RENEW_BEFORE
              value: {{ .Values.tls.certManager.renewBefore | quote }}
            {{- if and .Values.backup.bucket .Values.backup.endpoint }}
            # The name of the ObjectStore, and nothing else. No bucket, no
            # endpoint, no credential — the operator reads those, and the
            # control plane never talks to object storage.
            - name: DRIGODB_BACKUP_OBJECT_STORE
              value: {{ include "drigodb.objectStoreName" . | quote }}
            {{- end }}
            # Its own namespace, for the NetworkPolicy rule that lets it read a
            # database's metrics port. From the downward API rather than a
            # value, because a chart installed into a different namespace must
            # not have to be told twice where it is.
            - name: DRIGODB_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: DRIGODB_IDLE_AFTER_SECONDS
              value: {{ .Values.idle.afterSeconds | quote }}
            - name: DRIGODB_IDLE_CHECK_SECONDS
              value: {{ .Values.idle.checkIntervalSeconds | quote }}
            - name: DRIGODB_TLS_CA_SECRET
              value: {{ include "drigodb.caSecret" . | quote }}
          # /readyz, not /healthz. Readiness asks whether drigodb can do its job
          # on this cluster, which is a different question from whether the
          # process is running — and both things it checks (the CloudNativePG
          # operator, a usable StorageClass) fail silently when they are absent.
          # Without this, `helm install` on a cluster missing either reports
          # success and the first consumer finds out instead.
          #
          # failureThreshold is generous because this is a cluster-shaped
          # problem, not a flaky one: it will not fix itself between probes, and
          # nothing is gained by declaring it quickly.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          # Liveness stays on /healthz. A cluster missing an operator is not a
          # reason to restart a working process, and a readiness probe that
          # doubles as liveness would crash-loop the pod for something no
          # restart can fix.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
