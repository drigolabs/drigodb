apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
---
{{/*
Deliberately a Role, not a ClusterRole: the API can act only inside the database
namespace. It cannot read a Secret anywhere else in the cluster.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Values.databaseNamespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    # patch, so wake can rewrite a hibernated database's pod template onto the
    # images and probes this build renders. Not update: the whole-object verb is
    # not needed, and a StatefulSet's selector, serviceName and
    # volumeClaimTemplates are immutable anyway.
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    # update, so credential rotation can replace a database's password Secret.
    # The pod reads it at start, so rotation is a Secret write plus a restart —
    # the API never connects to PostgreSQL itself.
    #
    # patch, so a resize can grow a PVC. A StatefulSet's volumeClaimTemplates is
    # immutable, so growing a database means patching the live claim — there is
    # no other way to do it.
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    # One log, from the purge Job's pod, because that is where the answer is.
    # The script prints a line of JSON saying which archive generations it found
    # and how many objects and bytes it removed, and the endpoint returns it —
    # a purge whose caller cannot see what it reclaimed is not a mechanism
    # anything can be run from outside (decision 0008).
    #
    # Read-only, and the pods in this namespace are databases and drigodb's own
    # Jobs. PostgreSQL's log is already visible to anyone who can `kubectl logs`
    # in the namespace; this adds no reach the Role did not have.
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # Purging a deleted database's archive runs as a Job (#135), because it needs
    # the bucket credential and the control plane deliberately cannot hold one.
    # delete, because the Job's name is derived from the database id rather than
    # random — so a retry has to clear the previous attempt, and can then read
    # exactly one pod's log for the result.
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    # update, because a wake rewrites an existing database's policy to whatever
    # this build renders. Nothing else does: a database created by an older
    # drigodb keeps the policy it was born with forever, so a release that adds
    # a rule would reach new databases only.
    verbs: ["create", "get", "list", "update", "delete"]
  # A hosted database is a CloudNativePG Cluster (decision 0004), so these are
  # the verbs that provision, hibernate, wake and delete one. The operator does
  # the rest: it owns the pods, the volumes and the Services, and drigodb never
  # names them.
  #
  # No `update`. Hibernation is an annotation and a resize is a storage size, so
  # every change drigodb makes to a live Cluster is a patch — and the
  # whole-object verb would let a bug replace a database's spec wholesale.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # A backup is an object drigodb asks for and then reads the status of. delete,
  # because a deleted database's Backup objects would otherwise outlive it,
  # pointing at a Cluster that no longer exists.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create", "get", "list", "delete"]
  # get, and only get. A purge has to build the Job's environment from the bucket
  # the installation actually configured, and the ObjectStore is where that is
  # written — destinationPath, endpointURL, and the NAME of the Secret holding
  # the keys. Reading it teaches the control plane no credential: it passes the
  # Secret reference into the pod and cannot resolve it, which is the same trade
  # the operator already runs on.
  #
  # The alternative was copying bucket and endpoint into the API's own
  # environment, giving one bucket two declarations that can disagree. This
  # repository has already had a pin rot at 0.0.1 for seven releases because
  # nothing read it; a second copy of the destination path is that failure with a
  # customer's backups behind it.
  #
  # No create, no patch, no delete. drigodb still does not own the ObjectStore —
  # the chart does.
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get"]
{{- if .Values.tls.certManager.enabled }}
  # One Certificate per database, in this namespace, so each serves a certificate
  # for its own Service name and its Secret lands where the pod mounts it.
  # Granted only when the feature is on: an installation without cert-manager has
  # no reason to hold rights over CRDs that are not installed.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "delete"]
{{- end }}
---
{{/*
The one cluster-scoped grant drigodb takes, and it is read-only over a resource
that holds no secrets.

StorageClasses are cluster-scoped, so there is no namespaced way to ask "does
this cluster have a default". Without the answer, an installation with no
default StorageClass installs green and every database then sits in
provisioning forever with an unbound volume and no error anywhere — see
src/k8s/preflight.ts.

The Role above stays deliberately namespaced and that property is unchanged:
the API still cannot read a Secret anywhere outside the database namespace.
This adds `get, list, watch` on StorageClasses and nothing else.

If a cluster declines to grant it, drigodb still runs — the check reports
itself unverified rather than failed, because "I was not allowed to look" is
not "it is missing".
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "drigodb.fullname" . }}-preflight
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "drigodb.fullname" . }}-preflight
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "drigodb.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "drigodb.fullname" . }}-preflight
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Values.databaseNamespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "drigodb.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "drigodb.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
