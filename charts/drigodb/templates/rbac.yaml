apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
---
{{/*
Deliberately a Role, not a ClusterRole: the API can act only inside the database
namespace. It cannot read a Secret anywhere else in the cluster.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Values.databaseNamespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    # patch, so wake can rewrite a hibernated database's pod template onto the
    # images and probes this build renders. Not update: the whole-object verb is
    # not needed, and a StatefulSet's selector, serviceName and
    # volumeClaimTemplates are immutable anyway.
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    # update, so credential rotation can replace a database's password Secret.
    # The pod reads it at start, so rotation is a Secret write plus a restart —
    # the API never connects to PostgreSQL itself.
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # Restoring into a new database runs as a Job, which connects to the
    # database over TCP as an ordinary consumer.
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Values.databaseNamespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "drigodb.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "drigodb.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
