apiVersion: v1
kind: Service
metadata:
  name: {{ include "drigodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drigodb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "drigodb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
