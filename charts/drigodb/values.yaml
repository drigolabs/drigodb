# drigodb — PostgreSQL databases, provisioned through an API.
#
# The only value most installations need to think about is
# `database.storageClass`, and only if the cluster has no default.

image:
  repository: ghcr.io/drigolabs/drigodb-api
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

api:
  # One, and the concurrency work in this repository is not what pays for that.
  #
  # Idempotent create is safe at ANY replica count — the StatefulSet's name is
  # the lock — but it had to be, because the race was never really about
  # replicas. Two simultaneous creates for one external_id produced two
  # databases on a SINGLE replica: the handler awaits a read before it writes,
  # and both requests get through that gap. Measured on kind, two StatefulSets,
  # two volumes, one application's data split in half.
  #
  # So this is a capacity setting rather than a correctness one, and at one
  # consumer there is no capacity problem to solve. A second replica is 45 MiB
  # measured — against decision 0001's 1500 MiB node that fits two databases,
  # that is a meaningful fraction of a database for availability nobody is
  # asking for yet.
  #
  # The blast radius of losing the control plane is small, and worth stating
  # because it is the main argument for this architecture: existing databases
  # are unaffected. Consumers connect to their own database directly, not
  # through here, so an outage stops provisioning, waking and hibernating — not
  # serving. A rollout costs a few seconds of that.
  #
  # Raise it to 2 when waking moves onto the serving path. Automatic
  # hibernation (#85) is what does that: once a cold application's first request
  # depends on a wake, an API outage stops traffic rather than administration,
  # and the PodDisruptionBudget below turns itself on.
  replicas: 1
  # Keeps a voluntary disruption — a drain, an upgrade — from taking both at
  # once. Set to 0 alongside replicas: 1, or a single-replica install can never
  # be drained at all.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # The bearer token every API call carries. One of these is required — the
  # chart will not invent a credential, because a template that generates one
  # renders differently every time and silently rotates it under any renderer
  # without a cluster. See templates/secret-api-token.yaml.
  #
  # existingSecret is the right answer for anything real: the token belongs in
  # SOPS, External Secrets or sealed-secrets, not in a values file that lives in
  # git. It must hold a `token` key.
  existingSecret: ""
  # An explicit value, for kind and for trying it out. It ends up in Helm's
  # release metadata, so it is not where a real credential belongs.
  token: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The namespace hosted databases are provisioned into. Separate from the
# release namespace on purpose: it is the blast radius of the API's RBAC, and
# the two are worth being able to reason about apart.
databaseNamespace: drigodb-databases

database:
  # Empty means the cluster's default StorageClass. That is what makes this
  # installable on kind, EKS or GKE without being told which — set it only if
  # the cluster has no default, or the default is the wrong one.
  #
  #   DigitalOcean  do-block-storage
  #   kind          standard
  storageClass: ""

  # Which tier a database is created on, and how far its owner may grow it.
  #
  #   small   1Gi   max_wal_size 256MB    ~2 million rows
  #   medium  5Gi   max_wal_size 1GB      ~11 million
  #   large   20Gi  max_wal_size 2GB      ~50 million
  #
  # A volume can be expanded in place and can never be shrunk, so a tier only
  # ever goes up. maxTier is the approval: a resize is granted automatically as
  # long as it stays within it, and nothing grows a database on its own.
  defaultTier: small
  maxTier: large

  # The PostgreSQL a hosted database runs. CNPG's official image; drigodb does
  # not build one.
  image: ghcr.io/cloudnative-pg/postgresql:18

  # The DNS suffix used to build connection endpoints.
  endpointSuffix: svc.cluster.local

# Server authentication for hosted databases.
#
# Off by default, and drigodb works without it: bootstrap.sh generates a
# self-signed certificate and connection URIs say sslmode=require. Traffic is
# encrypted either way — what this adds is the client being able to tell it is
# talking to the database it asked for.
#
# cert-manager is a PREREQUISITE, not a dependency. Most clusters already run
# one, and installing a second for someone who has one is worse than asking.
tls:
  certManager:
    enabled: false
    # Empty means the chart creates a CA of its own, rooted in a self-signed
    # issuer. Point this at an existing ClusterIssuer or Issuer to use one you
    # already run — the names being signed are in-cluster and unresolvable
    # outside it, so a public issuer could never sign them and a private CA is
    # the only thing that fits rather than a compromise.
    issuerRef:
      name: ""
      kind: ClusterIssuer
    # How long a database's certificate lives, and when cert-manager renews it.
    # A renewed certificate reaches a running database on its next restart, so
    # the window wants to be comfortable rather than tight.
    duration: 2160h    # 90 days
    renewBefore: 360h  # 15 days

# Put idle databases to sleep, without anyone asking.
#
# ON by default, at four hours. Set afterSeconds to 0 to turn it off.
#
# On rather than off because it is the economic argument for the whole design: a
# fleet of applications that are mostly abandoned costs a running pod each,
# forever, until something puts them to sleep. An operator who wants databases
# that never sleep should say so, rather than every operator who has not thought
# about it paying for them.
#
# UPGRADING AN EXISTING INSTALLATION TURNS THIS ON. Databases that have been
# running untouched will begin hibernating, and nothing wakes one because a
# client connected — the next connection fails until something calls wake. If
# that is not what you want, set afterSeconds to 0 before you upgrade.
#
# What it costs when it is on: a database with no application connections for
# that long is hibernated, and the next connection to it FAILS — nothing wakes a
# database because a client tried to reach it. A consumer has to call
# POST /wake and retry, and issue #87 is the argument about whether drigodb
# should grow something in the connection path to do that for them.
#
# So this is right for a fleet of applications whose owner controls the client
# code and wrong for a database somebody points psql at.
#
# It also gives the control plane a network path it did not have before: the
# NetworkPolicy admits drigodb to each database's METRICS port, because
# connection counts live in pg_stat_activity and drigodb has no credential to
# read them with. It learns that there are connections, never what they are, and
# still cannot log in.
idle:
  # Seconds with no application connections before a database is hibernated.
  # 0 disables it entirely.
  #
  # Four hours: long enough that a database somebody is working against during a
  # workday does not disappear between tasks, short enough that an application
  # nobody opened today stops costing a pod overnight.
  afterSeconds: 14400
  # How often to look, and NOT a knob to save requests with.
  #
  # Idleness is sampled — drigodb counts open connections at each check — so a
  # workload that connects, queries and disconnects can be missed by every
  # sample and be hibernated while in use. How likely that is depends entirely
  # on this number, because a shorter interval both takes more samples and makes
  # each one likelier to land on a live connection.
  #
  # For a database used once a minute by a 100ms connection, over the 4h
  # threshold above:
  #
  #   every 60s → 240 samples → 67% chance of wrongly sleeping it
  #   every 30s → 480 samples → 20%
  #   every 15s → 960 samples →  0.2%
  #
  # Hence 15. The cost is 960 cheap HTTP requests per database per window,
  # which is nothing next to hibernating a database somebody is using.
  #
  # An application that holds a pooled connection — the ordinary case — is not
  # affected by any of this: its connection is open at every sample.
  checkIntervalSeconds: 15

# Backups, through CloudNativePG's barman-cloud plugin.
#
# Off unless a bucket and an endpoint are set — an installation with neither
# gets no ObjectStore and no plugin reference on any Cluster, which is exactly
# what it had before.
#
# One ObjectStore serves the whole installation rather than one per database.
# Databases are separated inside the bucket by CloudNativePG's serverName, which
# defaults to the Cluster's name — and drigodb's names are derived from
# external_id, so they are already distinct.
#
# REQUIRES the barman-cloud plugin on the cluster, which requires cert-manager.
# scripts/cnpg-install.sh installs both; issue #97 makes that declarative.
backup:
  # s3://bucket/ — the path backups and WAL are written under.
  bucket: ""
  # For S3 itself this can be empty. For anything S3-compatible — DigitalOcean
  # Spaces, MinIO — it is the endpoint, and without it the plugin talks to AWS.
  endpoint: ""
  region: ""
  # Holds access_key and secret_key, in the database namespace. drigodb never
  # reads it: it names the Secret and the operator does the reading, which is
  # why the control plane holds no object-storage credential at all.
  credentialsSecret: drigodb-backup-credentials
  # How long backups and WAL are kept. `XXu` where u is d, w or m.
  retention: 30d

nameOverride: ""
fullnameOverride: ""
