apiVersion: v2
name: drigodb
description: PostgreSQL databases, provisioned through an API
type: application
# The chart's own version, bumped when the chart changes.
version: 0.1.0
# The control plane this chart installs by default. Moved by the standing issue
# a release files — see the README's Continuous delivery section.
# The API image this chart installs when image.tag is unset, which is the
# default and the documented path.
#
# It was left at 0.9.1 while the chart moved on, and the two stopped being
# compatible at v0.12.0: that release added GET /readyz AND the readinessProbe
# that calls it, in the same commit. So `bash scripts/deploy.sh` with no image
# override pulled 0.9.1, whose readiness probe 404s forever:
#
#   Readiness probe failed: HTTP probe failed with statuscode: 404
#   Error: resource Deployment/drigodb-system/drigodb-api not ready
#
# Four releases of the documented install being unable to come up. Nothing
# noticed because every path that runs regularly overrides the image: CI builds
# :dev from the tree, and kind-up.sh does the same. The only caller using this
# value is a person following the instructions.
appVersion: "0.16.3"
home: https://github.com/drigolabs/drigodb
sources:
  - https://github.com/drigolabs/drigodb
keywords: [postgresql, database, provisioning, multi-tenant]
maintainers:
  - name: drigolabs
    url: https://github.com/drigolabs
