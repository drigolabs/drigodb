# Host-based auth for a per-app database pod.
#
# ORDER MATTERS. pg_hba is first-match.
#
# TYPE  DATABASE  USER     ADDRESS      METHOD

# Local socket connections, authenticating by peer: the server's own internal
# connections, bootstrap.sh's administration, and the backup sidecar, which
# shares the pod's UID and reaches the socket over a shared volume.
local   all       all                   peer

# Applications, over TLS only, and only into their own database as their own
# role. There is no rule admitting any other database or any other user, so a
# credential that leaks reaches exactly one database.
#
# The control plane is deliberately absent from this file. It holds every
# credential but has no route to use one — schema changes reach a database
# through bootstrap.sh, never over the network. See issue #29.
hostssl app       appuser  0.0.0.0/0    scram-sha-256
hostssl app       appuser  ::/0         scram-sha-256
