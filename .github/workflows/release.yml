# Merge to main, and if the commits earned a version, it ships.
#
#   commits  →  version  →  multi-arch image  →  git tag + release  →  DOKS
#
# The version comes from the Conventional Commit subjects since the last tag
# (scripts/next-version.sh, runnable locally). A merge of only docs: and chore:
# commits releases nothing and deploys nothing, which is the correct amount of
# ceremony for a README fix.
#
# The deploy step is deliberately forgiving about the cluster being gone. DOKS
# billing runs whether or not anyone is using it, so the cluster is torn down
# between sessions — a merge on a Sunday should publish an image and say so,
# not fail because nothing was listening.
name: release

on:
  push:
    branches: [main]

# Never overlap: two runs minting tags at once would race on the version.
concurrency:
  group: release
  cancel-in-progress: false

# The floor. Only the two jobs that must write — the image push and the release
# commit — raise it, and each raises only its own.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/drigodb-api

jobs:
  version:
    name: decide the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      released: ${{ steps.next.outputs.released }}
    steps:
      # Full history and tags: the bump is computed from the range between the
      # last v-tag and HEAD, and a shallow clone has neither end of it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: next
        run: |
          VERSION="$(bash scripts/next-version.sh --why)"
          if [ -z "$VERSION" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No feat:, fix:, perf: or breaking commits since the last release — nothing to ship."
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing ${VERSION}"
          fi

  # ci.yml runs on this same commit, but it is a separate workflow: a red run
  # there would not stop a release here. The gate has to be inside the pipeline
  # that publishes, so it is repeated rather than referenced.
  verify:
    name: typecheck and test
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: build ${{ matrix.arch }}
    needs: [version, verify]
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners rather than one QEMU-emulated job. This repo is
          # public, so the arm64 runner costs nothing, and emulating a Node
          # install and a TypeScript compile is slow for no benefit.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch is pushed as a nameless digest; the manifest job below binds
      # them to one tag. Tagging here instead would have the second arch
      # overwrite the first.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DRIGODB_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          # The filename is the bare hex; the manifest job puts the `sha256:`
          # back. Keeping the prefix here would build `…@sha256:sha256:…`.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-api-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-api-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag is immutable — nothing ever pushes over it, which is
      # what lets the deployment use imagePullPolicy: IfNotPresent. `latest`
      # moves, and is for humans reading the package page, not for deployments.
      - name: Bind both architectures to one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.version }}"

  tag:
    name: tag and record
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      # To push a tag ref. Not a branch: nothing in this pipeline writes to
      # main, which is what lets main be protected against everyone.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag on the commit that was merged, and nothing else.
      #
      # An earlier version of this also committed the version into package.json
      # and rewrote the image pin. Both were dropped: the
      # commit had to be pushed to main, and a branch no one may push to is
      # worth more than a bookkeeping commit. Neither was load-bearing —
      # scripts/next-version.sh reads tags, the image takes its version from a
      # build arg, and scripts/deploy.sh derives the image from the newest tag.
      #
      # The tag is created after the image is published, so a version tag can
      # never name an image that failed to build.
      - name: Tag the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --generate-notes walks back to the previous release on its own.
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes

  # A release publishes an image and stops. This is what says so — the one-line
  # diff that would ship it, in an issue rewritten by each release rather than
  # duplicated per version.
  #
  # Deliberately not a pull request opened by Actions. That needs the repository
  # setting granting workflows permission to create AND approve pull requests,
  # and a workflow that can approve its own can satisfy a required review by
  # itself. So CI reports and a human opens the pull request — the same trade
  # images.yml makes, for the same reason.
  notify:
    name: report the pin
    needs: [version, manifest, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Work out whether the pin moved
        id: diff
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMG: ${{ env.IMAGE }}
        run: |
          # The pin lives in the chart's appVersion now: it is the chart's
          # declaration of which drigodb it installs, and Helm defaults the
          # image tag to it.
          sed -i -E "s#^appVersion: .*#appVersion: \"${VERSION}\"#" charts/drigodb/Chart.yaml
          if git diff --quiet; then
            echo "::notice::the chart already pins ${VERSION}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff > /tmp/pin.patch

      - name: Open or update the standing release issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "A newer release is ready to pin"
        run: |
          {
            echo "\`v${VERSION}\` is published. It is **not** deployed: the chart's \`appVersion\` is what"
            echo "is deployed, and a release cannot pin itself — the commit being released does not"
            echo "yet name the image it is about to build."
            echo
            echo "Merging this diff is what ships it."
            echo
            echo '```diff'
            cat /tmp/pin.patch
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "_Rewritten by each release rather than duplicated. Close it once the pin is merged._"
          } > /tmp/issue-body

          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body
            echo "::notice::Updated issue #${EXISTING} with the ${VERSION} pin."
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body
          fi

  deploy:
    name: deploy to DOKS
    needs: [version, manifest, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The merged commit, which is also what the tag now points at.
      - uses: actions/checkout@v5

      # No doctl, and no DigitalOcean token. CI holds a ServiceAccount token
      # scoped to what deploying actually does, minted by scripts/doks-up.sh —
      # which already runs as an administrator, because creating the cluster
      # requires one.
      #
      # What this replaces: a kubeconfig fetched from DigitalOcean at deploy
      # time, which authenticates as the account owner and is cluster-admin,
      # because DigitalOcean has no lesser kubeconfig to issue. A leaked
      # repository secret reached the whole account rather than one deployment.
      - name: Is there anywhere to deploy to?
        id: target
        env:
          DEPLOY_TOKEN: ${{ secrets.DRIGODB_DEPLOY_TOKEN }}
          SERVER: ${{ secrets.DRIGODB_CLUSTER_SERVER }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ] || [ -z "$SERVER" ]; then
            echo "::notice::No deploy credential — image ${{ needs.version.outputs.version }} is published, deploy skipped. Run scripts/doks-up.sh to mint one."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # The hosted runner ships a kubectl; this is the guard for the day it
      # does not.
      - name: Ensure kubectl
        if: steps.target.outputs.go == 'true'
        run: |
          if ! command -v kubectl >/dev/null; then
            VER="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client

      - name: Can the cluster be reached, or stand down?
        id: cluster
        if: steps.target.outputs.go == 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DRIGODB_DEPLOY_TOKEN }}
          SERVER: ${{ secrets.DRIGODB_CLUSTER_SERVER }}
          CA: ${{ secrets.DRIGODB_CLUSTER_CA }}
        run: |
          printf '%s' "$CA" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster drigodb --server="$SERVER" --certificate-authority=/tmp/ca.crt --embed-certs=true >/dev/null
          kubectl config set-credentials deployer --token="$DEPLOY_TOKEN" >/dev/null
          kubectl config set-context drigodb --cluster=drigodb --user=deployer >/dev/null
          kubectl config use-context drigodb >/dev/null

          # Asking whether the cluster ANSWERS, rather than whether a provider
          # API says it exists. The old check asked DigitalOcean, which a
          # read-scoped token could do — so it passed while the very next call
          # failed 403, and seven releases reported success without ever
          # deploying. A check that does not use the credential it is checking
          # is not a check. See issue #15.
          if ! kubectl --request-timeout=20s get namespace drigodb-system >/dev/null 2>&1; then
            echo "::notice::Cluster unreachable — image ${{ needs.version.outputs.version }} is published and will deploy on the next \`scripts/doks-up.sh && scripts/deploy.sh\`."
            echo "up=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "up=true" >> "$GITHUB_OUTPUT"

      # Deploys what the chart pins, which is NOT what this run just
      # built. The commit being released cannot name the image the release is
      # about to produce, so a release publishes and the pin moves in a separate
      # merge. Ordinarily this is a no-op that reconciles anything else that
      # changed in the same merge — config, RBAC, migrations.
      - name: Deploy what is pinned
        if: steps.cluster.outputs.up == 'true'
        run: bash scripts/deploy.sh

      # Asserts the cluster serves what the manifest pins. It used to assert it
      # served the version this run produced, which was only true because the
      # deploy step overrode the pin with it.
      - name: Verify the running version
        if: steps.cluster.outputs.up == 'true'
        run: |
          PINNED="$(sed -nE 's#^appVersion: "?([^"]*)"?#\1#p' charts/drigodb/Chart.yaml | head -1)"
          echo "the chart pins ${PINNED}"

          kubectl -n drigodb-system port-forward svc/drigodb-api 8080:80 >/tmp/pf.log 2>&1 &
          for _ in $(seq 1 30); do grep -q "Forwarding from" /tmp/pf.log && break; sleep 1; done

          GOT="$(curl -fsS --retry 5 --retry-delay 2 localhost:8080/healthz)"
          echo "$GOT"
          case "$GOT" in
            *"\"version\":\"${PINNED}\""*) echo "::notice::${PINNED} is live, as pinned." ;;
            *) echo "::error::/healthz reports something other than the pinned ${PINNED}"; exit 1 ;;
          esac
