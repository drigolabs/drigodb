# What must be true before anything merges.
#
# Nothing here pushes an image or touches a cluster — it only proves the three
# images build and that the two whose failure modes are silent actually work.
# Building the postgres image says the package installed; it does not say the
# extension loads. The smoke and integration tests are what say that, and they
# are the reason this workflow is slower than a typecheck-and-test job.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant. main is
# exempt: its runs are the record of what was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The only job that proves drigodb actually provisions a database. The others
  # prove the images build, the units pass, the chart renders deterministically,
  # a backup restores and migrations apply — all true of a drigodb that cannot
  # hand anyone a database.
  #
  # NOT YET A REQUIRED CHECK. Branch protection on main matches three checks by
  # exact name and this is not one of them, so it reports without gating. Adding
  # it is #91, and it needs the name below verbatim.
  #
  # The name is therefore already its permanent one. Renaming a job that
  # protection matches by string blocks every pull request on a check that never
  # reports, so there is no later moment at which this can be tidied up.
  end-to-end:
    name: drigodb works end to end
    runs-on: ubuntu-latest
    # Runs in about three minutes. The ceiling is here so a hang costs minutes
    # rather than hours, not because the job is expected to approach it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # kubectl, helm and docker are already on ubuntu-latest — this repository
      # already builds images on these runners. kind is the only addition, and it
      # is pinned for the same reason every other version here is.
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -o root -g root -m 0755 kind /usr/local/bin/kind
          kind version

      - name: What this runner already has
        run: |
          echo "docker  $(docker --version)"
          echo "kubectl $(kubectl version --client -o json | python3 -c 'import json,sys;print(json.load(sys.stdin)["clientVersion"]["gitVersion"])')"
          echo "helm    $(helm version --short)"
          echo "memory  $(free -g | awk '/^Mem:/{print $2" GiB"}')"

      # The same script a laptop runs, deliberately. A second path for CI would
      # drift from the first, which this repository has already been bitten by.
      - name: Bring up drigodb on kind
        run: |
          start=$SECONDS
          DRIGODB_KIND_CLUSTER=ci bash scripts/kind-up.sh --local
          echo "KIND_UP_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      - name: End to end
        run: |
          start=$SECONDS
          KUBE_CONTEXT=kind-ci bash scripts/smoke.sh
          echo "SMOKE_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      # A failing end-to-end test that shows only "exit 1" teaches people to
      # re-run CI rather than read it, which is worse than not having the test.
      - name: Why it failed
        if: failure()
        run: |
          kubectl --context kind-ci get pods -A -o wide || true
          kubectl --context kind-ci -n drigodb-system logs -l app.kubernetes.io/name=drigodb --tail=100 || true
          kubectl --context kind-ci -n drigodb-databases get sts,pvc,svc,networkpolicy || true
          kubectl --context kind-ci -n drigodb-databases describe pods || true
          kubectl --context kind-ci -n cnpg-system logs -l app.kubernetes.io/name=cloudnative-pg --tail=50 || true

      # Printed on every run rather than only when something breaks: this job is
      # the slowest thing in CI, so the moment it starts taking twice as long is
      # worth being able to see without digging through logs.
      - name: How long it took
        if: always()
        run: |
          echo "### End to end on kind" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| step | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| kind up, build, install | ${KIND_UP_SECONDS:-n/a} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| smoke.sh | ${SMOKE_SECONDS:-n/a} |" >> "$GITHUB_STEP_SUMMARY"

  api-image:
    name: api image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,scope=api-amd64

  # Name kept exactly as it is: branch protection on main requires the check
  # "data-plane images work". Renaming it needs the protection rule updated in
  # the same breath, or every pull request blocks on a check that never reports.
  data-plane-images:
    name: data-plane images work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Read the pinned upstream versions
        # grep, not cat: $GITHUB_ENV rejects any line that is not NAME=value,
        # and versions.env is commented.
        run: grep -E '^[A-Z_]+=' images/versions.env >> "$GITHUB_ENV"

      # Only the backup image is ours. The postgres and gateway images are gone
      # — databases run CNPG's postgresql directly, so there is nothing here to
      # smoke-test for a loaded extension and no wire-protocol gateway to drive
      # a MongoDB driver against. See docs/leaving-documentdb.md.
      #
      # Built from the PUBLISHED base rather than a locally loaded one:
      # setup-buildx-action uses a container driver, which cannot see images in
      # the local Docker daemon.
      - name: Build backup
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-backup
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-backup:ci
          build-args: |
            POSTGRES_IMAGE=ghcr.io/cloudnative-pg/postgresql:${{ env.PG_MAJOR }}
          cache-from: type=gha,scope=backup-amd64
          cache-to: type=gha,mode=max,scope=backup-amd64

      # Writes rows to a real server, backs them up, restores into a SECOND
      # RUNNING instance, and reads the rows and an expression index back.
      # Asserting on the data is the assertion that matters: under DocumentDB a
      # pg_dump-based backup restored with no error at all and lost every
      # collection.
      - name: Backup restore test
        run: |
          bash images/postgres-backup/integration-test.sh \
            drigolabs/drigodb-backup:ci \
            ghcr.io/cloudnative-pg/postgresql:${{ env.PG_MAJOR }}

      # Lives in this job rather than a new one because branch protection on
      # main requires three checks by name, and a test this consequential must
      # be one of them — a separate job could fail without blocking a merge.
      # It is why the job's name is now broader than it reads.
      #
      # Runs the real bootstrap.sh against the real image. The assertion that
      # earns its place is the last one: an edited migration must stop a server
      # from starting, and that has to be caught here rather than on a fleet
      # where it would stop every database from waking.
      # No cluster, a second to run, and it is what stops a template reaching for
      # a cluster or a clock again. The last one rotated every consumer's bearer
      # token on every Argo sync while reporting Synced.
      - name: The chart renders the same bytes every time
        run: bash scripts/chart-determinism-test.sh

      - name: In-database migrations test
        run: |
          bash scripts/migrations-test.sh \
            ghcr.io/cloudnative-pg/postgresql:${{ env.PG_MAJOR }}
