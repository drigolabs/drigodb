# What must be true before anything merges.
#
# Nothing here pushes an image or touches a cluster — it only proves the three
# images build and that the two whose failure modes are silent actually work.
# Building the postgres image says the package installed; it does not say the
# extension loads. The smoke and integration tests are what say that, and they
# are the reason this workflow is slower than a typecheck-and-test job.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant. main is
# exempt: its runs are the record of what was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api-image:
    name: api image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,scope=api-amd64

  data-plane-images:
    name: data-plane images work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Read the pinned upstream versions
        # grep, not cat: $GITHUB_ENV rejects any line that is not NAME=value,
        # and versions.env is commented.
        run: grep -E '^[A-Z_]+=' images/versions.env >> "$GITHUB_ENV"

      # Loaded into the local daemon rather than pushed: the test scripts run
      # `docker run` against these tags. amd64 only — a native arm64 leg would
      # need a second runner and proves nothing these tests do not, and the
      # release path builds arm64 anyway.
      - name: Build postgres
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-documentdb
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-postgres:ci
          build-args: |
            PG_MAJOR=${{ env.PG_MAJOR }}
            DOCUMENTDB_VERSION=${{ env.DOCUMENTDB_VERSION }}
          cache-from: type=gha,scope=postgres-amd64
          cache-to: type=gha,mode=max,scope=postgres-amd64

      - name: Build gateway
        uses: docker/build-push-action@v6
        with:
          context: images/documentdb-gateway
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-gateway:ci
          build-args: |
            DOCUMENTDB_VERSION=${{ env.DOCUMENTDB_VERSION }}
          cache-from: type=gha,scope=gateway-amd64
          cache-to: type=gha,mode=max,scope=gateway-amd64

      # The extension loads under CNPG's preload set and a document round-trips.
      - name: Postgres smoke test
        run: bash images/postgres-documentdb/smoke-test.sh drigolabs/drigodb-postgres:ci

      # A real MongoDB driver talks to the gateway over the wire protocol,
      # through the pg_hba/pg_ident files in config/ that production mounts.
      - name: Gateway integration test
        run: |
          bash images/documentdb-gateway/integration-test.sh \
            drigolabs/drigodb-gateway:ci drigolabs/drigodb-postgres:ci
