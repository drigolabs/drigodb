# The backup image: build, prove, publish, report.
#
# It has a different lifecycle from the API. Its version tracks the PostgreSQL
# major it is built against (images/versions.env), not this repo's, so it is not
# part of a semver release.
#
# THERE IS NO LONGER A WEEKLY REBUILD. There used to be, because the postgres
# image this repo built was on Ubuntu 24.04 rather than CNPG's own image — the
# DocumentDB extension linked against libicu74 where Debian trixie ships 76 —
# and that trade bought drigodb the job of patching its own base.
# Databases now run ghcr.io/cloudnative-pg/postgresql directly, so CNPG rebuild
# it and drigodb inherits that. See docs/leaving-documentdb.md.
#
# A rebuild that only proves it *builds* would miss the failure that matters.
# The DocumentDB era demonstrated exactly that: pg_dump exited zero and restored
# nothing, because the extension marked none of its catalog for dumping. So the
# integration test reads rows back after a restore rather than checking an exit
# code, and every publish here goes through it.
#
# Nothing here writes to the repository. It publishes an image and files one
# issue saying which tag is ready; moving the pin and opening the pull request
# stays a human act. See the `notify` job for why.
name: images

on:
  push:
    branches: [main]
    paths:
      - images/postgres-backup/**
      # The integration test mounts these, and they encode the peer-auth
      # contract the sidecar depends on. A change here can break the image
      # without its Dockerfile changing.
      - config/**
      - images/versions.env
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: work out the tags
    runs-on: ubuntu-latest
    outputs:
      pg_major: ${{ steps.v.outputs.pg_major }}
      backup_floating: ${{ steps.v.outputs.backup_floating }}
      backup_pinned: ${{ steps.v.outputs.backup_pinned }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          . ./images/versions.env

          # Two tags, doing two different jobs:
          #
          #   floating  18                  which PostgreSQL major this is for
          #   pinned    18-20260905-b7      which build of it, exactly
          #
          # Deployments reference the pinned tag, because a rebuild against a
          # patched base is a different image under the same major, and a node
          # caching the floating tag would never notice. The run number is in
          # there because a rebuild can happen twice in a day.
          BUILD="$(date -u +%Y%m%d)-b${GITHUB_RUN_NUMBER}"
          {
            echo "pg_major=${PG_MAJOR}"
            echo "backup_floating=${PG_MAJOR}"
            echo "backup_pinned=${PG_MAJOR}-${BUILD}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: the image actually works
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build backup
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-backup
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-backup:test
          build-args: |
            POSTGRES_IMAGE=ghcr.io/cloudnative-pg/postgresql:${{ needs.plan.outputs.pg_major }}
          cache-from: type=gha,scope=backup-amd64
          cache-to: type=gha,mode=max,scope=backup-amd64

      # Writes rows to a real server, backs them up to MinIO standing in for
      # Spaces, restores into a SECOND running instance, and reads them back.
      - name: Backup restore test
        run: |
          bash images/postgres-backup/integration-test.sh \
            drigolabs/drigodb-backup:test \
            ghcr.io/cloudnative-pg/postgresql:${{ needs.plan.outputs.pg_major }}

  build-backup:
    name: build backup ${{ matrix.arch }}
    needs: [plan, test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-backup
          platforms: linux/${{ matrix.arch }}
          # The same image the database runs, so pg_dump can never be older than
          # the server it dumps.
          build-args: |
            POSTGRES_IMAGE=ghcr.io/cloudnative-pg/postgresql:${{ needs.plan.outputs.pg_major }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/drigodb-backup,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backup-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backup-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-backup-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest-backup:
    name: publish backup
    needs: [plan, build-backup]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-backup-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind both architectures to both tags
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/drigodb-backup
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.plan.outputs.backup_pinned }}" \
            -t "${IMAGE}:${{ needs.plan.outputs.backup_floating }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ needs.plan.outputs.backup_pinned }}"

  notify:
    name: report the new pin
    needs: [plan, manifest-backup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deliberately not `pull-requests: write`. Opening a PR from Actions
      # requires the repository setting "Allow GitHub Actions to create and
      # approve pull requests", and that one toggle grants approval as well as
      # creation — a workflow that can approve its own pull request can satisfy
      # a required review on its own. Nothing here is worth that. The workflow
      # publishes and reports; a human opens the pull request.
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Work out whether the pin moved
        id: diff
        env:
          OWNER: ${{ github.repository_owner }}
          BK_PINNED: ${{ needs.plan.outputs.backup_pinned }}
        run: |
          BK_REF="ghcr.io/${OWNER}/drigodb-backup:${BK_PINNED}"
          sed -i -E "s#^( *value: ).*drigodb-backup:.*#\1${BK_REF}#" deploy/20-api.yaml

          if git diff --quiet; then
            echo "::notice::Pin already current — nothing to report."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          # The patch goes in the report so applying it is a copy-paste, not an
          # exercise in working out what CI meant.
          git diff > /tmp/pins.patch

      - name: Open or update the standing rebuild issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BK_PINNED: ${{ needs.plan.outputs.backup_pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Data-plane images: a newer build is ready to pin"
        run: |
          {
            echo "The backup image has been rebuilt and published against the current"
            echo "\`ghcr.io/cloudnative-pg/postgresql\` base."
            echo
            echo "It restored a database and read the rows back before publishing, so this"
            echo "is a rebuild proved to run, not merely to build."
            echo
            echo "| image | tag |"
            echo "|---|---|"
            echo "| backup | \`${BK_PINNED}\` |"
            echo
            echo "To ship it, move the pin in \`deploy/20-api.yaml\` and merge as a"
            echo "\`fix:\` — the release pipeline versions and deploys it from there."
            echo
            echo '```diff'
            cat /tmp/pins.patch
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "_This issue is rewritten by each rebuild rather than duplicated. Close it"
            echo "once the pin is merged._"
          } > /tmp/issue-body

          # One standing issue, kept current. Matched on the exact title rather
          # than the search API, which is eventually consistent and would
          # occasionally open a duplicate.
          EXISTING="$(gh issue list --state open --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body
            echo "::notice::Updated issue #${EXISTING} with the new pin."
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body
          fi
