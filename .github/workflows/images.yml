# The postgres and gateway images: build, prove, publish, report.
#
# These two have a different lifecycle from the API. Their version is upstream's
# (images/versions.env), not this repo's, so they are not part of a semver
# release — but they still need rebuilding when nothing here has changed at all.
#
# images/postgres-documentdb/Dockerfile explains why: it is built on Ubuntu
# 24.04 rather than CNPG's own image, because the DocumentDB extension links
# against libicu74 and Debian trixie ships 76. The cost of that choice, stated
# in the Dockerfile, is that drigodb owns base-image patching instead of
# inheriting CNPG's weekly rebuild. The schedule below is that debt being paid.
#
# A rebuild that only proves it *builds* would miss the failure that matters —
# the extension failing to load is a runtime error, not a packaging one — so
# every publish here goes through the same smoke and integration tests as a PR.
#
# Nothing here writes to the repository. The rebuild publishes images and files
# one issue saying which tags are ready; moving the pins and opening the pull
# request stays a human act. See the `notify` job for why.
name: images

on:
  push:
    branches: [main]
    paths:
      - images/**
      # The gateway's integration test mounts these files, and they encode the
      # peer-auth contract the gateway depends on. A change here can break the
      # pair without either Dockerfile changing.
      - config/**
      - .github/workflows/images.yml
  schedule:
    # Mondays, 04:17 UTC. Off the hour because everyone else schedules on it.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: work out the tags
    runs-on: ubuntu-latest
    outputs:
      pg_major: ${{ steps.v.outputs.pg_major }}
      documentdb_version: ${{ steps.v.outputs.documentdb_version }}
      postgres_floating: ${{ steps.v.outputs.postgres_floating }}
      postgres_pinned: ${{ steps.v.outputs.postgres_pinned }}
      gateway_floating: ${{ steps.v.outputs.gateway_floating }}
      gateway_pinned: ${{ steps.v.outputs.gateway_pinned }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          . ./images/versions.env

          # Two tags per image, doing two different jobs:
          #
          #   floating  18-0.116-0                  what this upstream release is
          #   pinned    18-0.116-0-20260830-b7      which build of it, exactly
          #
          # Deployments reference the pinned tag, because a rebuild against a
          # patched base is a different image with the same upstream version,
          # and a node caching the floating tag would never notice. The run
          # number is in there because a rebuild can happen twice in a day.
          BUILD="$(date -u +%Y%m%d)-b${GITHUB_RUN_NUMBER}"
          {
            echo "pg_major=${PG_MAJOR}"
            echo "documentdb_version=${DOCUMENTDB_VERSION}"
            echo "postgres_floating=${PG_MAJOR}-${DOCUMENTDB_VERSION}"
            echo "postgres_pinned=${PG_MAJOR}-${DOCUMENTDB_VERSION}-${BUILD}"
            echo "gateway_floating=${DOCUMENTDB_VERSION}"
            echo "gateway_pinned=${DOCUMENTDB_VERSION}-${BUILD}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: the pair actually works
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build postgres
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-documentdb
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-postgres:test
          build-args: |
            PG_MAJOR=${{ needs.plan.outputs.pg_major }}
            DOCUMENTDB_VERSION=${{ needs.plan.outputs.documentdb_version }}
          cache-from: type=gha,scope=postgres-amd64
          cache-to: type=gha,mode=max,scope=postgres-amd64

      - name: Build gateway
        uses: docker/build-push-action@v6
        with:
          context: images/documentdb-gateway
          platforms: linux/amd64
          load: true
          tags: drigolabs/drigodb-gateway:test
          build-args: |
            DOCUMENTDB_VERSION=${{ needs.plan.outputs.documentdb_version }}
          cache-from: type=gha,scope=gateway-amd64
          cache-to: type=gha,mode=max,scope=gateway-amd64

      - name: Postgres smoke test
        run: bash images/postgres-documentdb/smoke-test.sh drigolabs/drigodb-postgres:test

      - name: Gateway integration test
        run: |
          bash images/documentdb-gateway/integration-test.sh \
            drigolabs/drigodb-gateway:test drigolabs/drigodb-postgres:test

  build:
    name: build ${{ matrix.image }} ${{ matrix.arch }}
    needs: [plan, test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Spelled out rather than built from two axes plus `include`. An
        # `include` entry that names none of the base matrix's keys is merged
        # into every combination rather than multiplying them, which quietly
        # yields two jobs here instead of four.
        include:
          - { image: postgres, context: images/postgres-documentdb, arch: amd64, runner: ubuntu-latest }
          - { image: postgres, context: images/postgres-documentdb, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: gateway,  context: images/documentdb-gateway,  arch: amd64, runner: ubuntu-latest }
          - { image: gateway,  context: images/documentdb-gateway,  arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PG_MAJOR is meaningless to the gateway build and harmless to pass; the
      # Dockerfile simply does not declare the ARG. Keeping one step for both
      # images beats duplicating it to omit one argument.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PG_MAJOR=${{ needs.plan.outputs.pg_major }}
            DOCUMENTDB_VERSION=${{ needs.plan.outputs.documentdb_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/drigodb-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: publish ${{ matrix.image }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - image: postgres
            floating: ${{ needs.plan.outputs.postgres_floating }}
            pinned: ${{ needs.plan.outputs.postgres_pinned }}
          - image: gateway
            floating: ${{ needs.plan.outputs.gateway_floating }}
            pinned: ${{ needs.plan.outputs.gateway_pinned }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind both architectures to both tags
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/drigodb-${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ matrix.pinned }}" \
            -t "${IMAGE}:${{ matrix.floating }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.pinned }}"

  notify:
    name: report the new pins
    needs: [plan, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deliberately not `pull-requests: write`. Opening a PR from Actions
      # requires the repository setting "Allow GitHub Actions to create and
      # approve pull requests", and that one toggle grants approval as well as
      # creation — a workflow that can approve its own pull request can satisfy
      # a required review on its own. Nothing here is worth that. The workflow
      # publishes and reports; a human opens the pull request.
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Work out whether the pins moved
        id: diff
        env:
          OWNER: ${{ github.repository_owner }}
          PG_PINNED: ${{ needs.plan.outputs.postgres_pinned }}
          GW_PINNED: ${{ needs.plan.outputs.gateway_pinned }}
        run: |
          PG_REF="ghcr.io/${OWNER}/drigodb-postgres:${PG_PINNED}"
          GW_REF="ghcr.io/${OWNER}/drigodb-gateway:${GW_PINNED}"

          sed -i -E "s#^( *value: ).*drigodb-postgres:.*#\1${PG_REF}#" deploy/20-api.yaml
          sed -i -E "s#^( *value: ).*drigodb-gateway:.*#\1${GW_REF}#" deploy/20-api.yaml

          if git diff --quiet; then
            echo "::notice::Pins already current — nothing to report."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          # The patch goes in the report so applying it is a copy-paste, not an
          # exercise in working out what CI meant.
          git diff > /tmp/pins.patch

      - name: Open or update the standing rebuild issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PG_PINNED: ${{ needs.plan.outputs.postgres_pinned }}
          GW_PINNED: ${{ needs.plan.outputs.gateway_pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Data-plane images: a newer build is ready to pin"
        run: |
          {
            echo "The data-plane images have been rebuilt and published. Same upstream"
            echo "DocumentDB release; the base packages underneath it are current."
            echo
            echo "Both images passed the extension smoke test and the wire-protocol"
            echo "integration test before publishing, so this is a rebuild proved to run,"
            echo "not merely to build."
            echo
            echo "| image | tag |"
            echo "|---|---|"
            echo "| postgres | \`${PG_PINNED}\` |"
            echo "| gateway | \`${GW_PINNED}\` |"
            echo
            echo "To ship it, move the pins in \`deploy/20-api.yaml\` and merge as a"
            echo "\`fix:\` — the release pipeline versions and deploys it from there."
            echo
            echo '```diff'
            cat /tmp/pins.patch
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "_This issue is rewritten by each rebuild rather than duplicated. Close it"
            echo "once the pins are merged._"
          } > /tmp/issue-body

          # One standing issue, kept current, instead of a fresh one every Monday.
          # Matched on the exact title rather than the search API, which is
          # eventually consistent and would occasionally open a duplicate.
          EXISTING="$(gh issue list --state open --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body
            echo "::notice::Updated issue #${EXISTING} with the new pins."
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body
          fi
