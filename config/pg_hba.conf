# Host-based auth for a per-app database pod.
#
# ORDER MATTERS. pg_hba is first-match, so the scoped gateway rule must come
# first. An earlier catch-all peer rule would swallow it; a catch-all placed
# first instead of this one locks out every other local user.
#
# TYPE  DATABASE  USER                                                                                          METHOD  OPTIONS

# The gateway, assuming client roles by peer auth via the ident map.
local   all       "postgres",+documentdb_admin_role,+documentdb_readwrite_role,+documentdb_readonly_role         peer    map=documentdb-gateway-map

# The server's own internal libpq connections (extension internals, pg_cron).
local   all       all                                                                                           peer

# pg_basebackup, for the backup sidecar. A replication connection is NOT matched
# by `all` in the DATABASE column — it needs this keyword explicitly, and initdb
# generates such a line by default. This file replaces the generated one
# outright, which is why the line has to be restated here.
#
# Socket-only and peer-authenticated, so it admits exactly what already shares
# the pod. It opens no network path: the host rules below still reach no further
# than loopback.
local   replication  all                                                                                        peer

# TCP is reachable only from inside this pod and via the operator's
# port-forward; app traffic arrives through the gateway, never here.
host    all       all       127.0.0.1/32                                                                        scram-sha-256
host    all       all       ::1/128                                                                             scram-sha-256
