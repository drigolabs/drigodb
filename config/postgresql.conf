# PostgreSQL settings for a per-app database pod.
#
# Included from the cluster's generated postgresql.conf rather than appended to
# it, so a change to the mounted ConfigMap takes effect on the next restart
# instead of being frozen into PGDATA at init time. See bootstrap.sh.

# Applications connect over TCP from outside the pod. The NetworkPolicy and
# pg_hba decide who actually gets in.
listen_addresses = '*'

# Two socket directories: the default, and one on a volume shared with the
# backup sidecar. The sidecar reaches the server over that socket and
# authenticates by peer as the same UID, which is why backups need no
# credential of their own and no network path into the database.
unix_socket_directories = '/var/run/postgresql,/sockets'

# TLS, self-signed into PGDATA at first start by bootstrap.sh.
#
# Not the image's snakeoil pair: that key is root:ssl-cert 0640, readable only
# through supplementary group 101, and Kubernetes does not grant a pod the
# image's group memberships. Generating our own keeps this off an image-specific
# group id and puts the key where postgres already owns everything.
#
# Still self-signed, so clients pass sslmode=require rather than verify-full.
# A real issuer is issue #9.
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

# WAL, sized against the volume rather than left at the server defaults.
#
# max_wal_size defaults to 1GB. Measured on DigitalOcean 2026-09-01: a freshly
# provisioned database occupies 73 MB, of which 33 MB is already WAL. So on the
# 1Gi volume these databases get, the default reserves more than the entire disk
# before a single row is written — and max_wal_size is a checkpoint trigger, not
# a hard ceiling, so it can overshoot. PostgreSQL on a full disk does not
# degrade; it PANICs and will not restart until space is freed, which on a full
# PVC is not a quick recovery.
#
# The cost is more frequent checkpoints, so more full-page writes and more I/O.
# For a per-app database with a modest write rate that is the right side of the
# trade; a write-heavy tenant wants a bigger volume and a bigger max_wal_size
# with it.
max_wal_size = 256MB
min_wal_size = 64MB
