# DocumentDB-specific PostgreSQL settings for a per-app database pod.
#
# Appended to the cluster's generated postgresql.conf — this file carries only
# what DocumentDB and the co-located gateway require, not a full config.
#
# Every line here is load-bearing and was established by
# images/documentdb-gateway/integration-test.sh. Removing any one of them
# produces a failure that looks like something else entirely.

# The extension will not load without these three, in this order.
shared_preload_libraries = 'pg_cron,pg_documentdb_core,pg_documentdb'

# pg_cron binds to exactly ONE database per cluster, and DocumentDB can only be
# created in that database. This is the constraint behind cluster-per-app
# isolation — see docs/documentdb-multitenancy-spike.md F4.
cron.database_name = 'app'

# Two socket directories: the default path, and the one shared with the gateway
# container. Both are required — see the two settings below for why the default
# cannot be dropped.
unix_socket_directories = '/var/run/postgresql,/sockets'

# The extension's internal libpq connections (create_collection among them) and
# pg_cron's job connections both default to host=localhost over TCP, where they
# have no password. Pointed at the socket they authenticate by peer, which the
# pg_ident map permits. Without these, client auth succeeds and then every write
# fails with `fe_sendauth: no password supplied` from inside the extension.
documentdb.localhost_connection_string = 'host=/var/run/postgresql'
cron.host = '/var/run/postgresql'

# BSON renders as a BSONHEX dump without this — the difference between readable
# and unreadable data when an operator inspects it over SQL with DBeaver (U13).
documentdb_core.bsonUseEJson = on

# The gateway connects over the Unix socket only; TCP is for probes and for the
# operator's port-forward path.
listen_addresses = '*'

# WAL, sized against the volume rather than left at the server defaults.
#
# max_wal_size defaults to 1GB. Measured on DigitalOcean 2026-09-01: a freshly
# provisioned database occupies 73 MB, of which 41 MB is catalogs and extensions
# (PostGIS alone is 7.1 MB) and 33 MB is already WAL. So on the 1Gi volume these
# databases now get, the default reserves more than the entire disk before a
# single document is written — and max_wal_size is a checkpoint trigger, not a
# hard ceiling, so it can overshoot. PostgreSQL on a full disk does not degrade;
# it PANICs and will not restart until space is freed, which on a full PVC is
# not a quick recovery.
#
# At 256MB the floor is ~300 MB worst case, leaving ~724 MB for data — about
# 2 million documents at the 365 bytes each one measured at. The cost is more
# frequent checkpoints, so more full-page writes and more I/O. For a per-app
# database with a modest write rate that is the right side of the trade; a
# write-heavy tenant wants a bigger volume and a bigger max_wal_size with it.
max_wal_size = 256MB
min_wal_size = 64MB
