# Maps the gateway's OS user onto the DocumentDB role groups.
#
# Mandatory, not hardening. The gateway's system pool connects as its own role,
# but each authenticated client's data pool connects AS THAT CLIENT'S ROLE with
# an empty password. Peer auth only permits assuming another role through a
# '+group' ident entry, which is a PostgreSQL 16+ feature — one reason U1 pinned
# PostgreSQL 18.
#
# 'postgres' here is the OS user PostgreSQL resolves the gateway's UID to. The
# gateway container must run as PostgreSQL's UID (26) for this to match; a
# mismatch fails with "provided user name ... and authenticated user name ...
# do not match".
#
# MAPNAME                  SYSTEM-USERNAME   PG-USERNAME
documentdb-gateway-map     postgres          postgres
documentdb-gateway-map     postgres          +documentdb_admin_role
documentdb-gateway-map     postgres          +documentdb_readwrite_role
documentdb-gateway-map     postgres          +documentdb_readonly_role
