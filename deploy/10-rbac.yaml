apiVersion: v1
kind: ServiceAccount
metadata:
  name: drigodb-api
  namespace: drigodb-system
---
# Deliberately a Role, not a ClusterRole: the API can act only inside
# drigodb-databases. It cannot read a Secret anywhere else in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drigodb-api
  namespace: drigodb-databases
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    # patch, so wake can rewrite a hibernated database's pod template onto the
    # images and probes this build renders. Not update: the whole-object verb
    # is not needed, and a StatefulSet's selector, serviceName and
    # volumeClaimTemplates are immutable anyway.
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    # update, so credential rotation can replace a database's password Secret.
    # The pod reads it at start, so rotation is a Secret write plus a restart —
    # the API never connects to PostgreSQL itself.
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drigodb-api
  namespace: drigodb-databases
subjects:
  - kind: ServiceAccount
    name: drigodb-api
    namespace: drigodb-system
roleRef:
  kind: Role
  name: drigodb-api
  apiGroup: rbac.authorization.k8s.io
