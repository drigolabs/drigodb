apiVersion: apps/v1
kind: Deployment
metadata:
  name: drigodb-api
  namespace: drigodb-system
  labels: { app: drigodb-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: drigodb-api }
  template:
    metadata:
      labels: { app: drigodb-api }
    spec:
      serviceAccountName: drigodb-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          # Immutable: CI mints one version tag per release and never moves it,
          # so a cached layer under this tag is the build this tag names.
          # scripts/deploy.sh rewrites this line when DRIGODB_API_IMAGE is set,
          # which is how the release pipeline deploys what it just built.
          image: ghcr.io/drigolabs/drigodb-api:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DRIGODB_API_TOKEN
              valueFrom:
                secretKeyRef: { name: drigodb-api-token, key: token }
            - name: DRIGODB_STORAGE_CLASS
              value: do-block-storage
            # The data-plane images every provisioned database runs. Pinned here
            # rather than left to the API's compiled-in defaults so the images in
            # production are the images recorded in git.
            #
            # The postgres image is CNPG's own and is no longer built here, so
            # there is no weekly rebuild and no standing issue moving these
            # lines. Bumping it is an ordinary edit against upstream's tags.
            - name: DRIGODB_PG_IMAGE
              value: ghcr.io/cloudnative-pg/postgresql:18
            # Dated build tag, not the floating 18: a rebuild against a patched
            # base is a different image under the same major, and a node caching
            # the floating tag would never notice. images.yml publishes both and
            # files a standing issue carrying the diff that moves this line.
            - name: DRIGODB_BACKUP_IMAGE
              value: ghcr.io/drigolabs/drigodb-backup:18-20260905-b7
            # Backups are off until a bucket and an endpoint are set. Empty
            # here on purpose: with no destination configured no sidecar is
            # added, and a database is exactly what it was before. Set these
            # and create the drigodb-backup-credentials Secret to turn them on
            # — existing databases pick the sidecar up on their next wake,
            # through the same template reconcile that carries image updates.
            - name: DRIGODB_BACKUP_BUCKET
              value: ""
            - name: DRIGODB_BACKUP_ENDPOINT
              value: ""
            - name: DRIGODB_BACKUP_INTERVAL
              value: "86400"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: drigodb-api
  namespace: drigodb-system
spec:
  type: ClusterIP
  selector: { app: drigodb-api }
  ports:
    - name: http
      port: 80
      targetPort: http
