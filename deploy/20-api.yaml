apiVersion: apps/v1
kind: Deployment
metadata:
  name: drigodb-api
  namespace: drigodb-system
  labels: { app: drigodb-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: drigodb-api }
  template:
    metadata:
      labels: { app: drigodb-api }
    spec:
      serviceAccountName: drigodb-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          # Immutable: CI mints one version tag per release and never moves it,
          # so a cached layer under this tag is the build this tag names.
          # scripts/deploy.sh rewrites this line when DRIGODB_API_IMAGE is set,
          # which is how the release pipeline deploys what it just built.
          image: ghcr.io/drigolabs/drigodb-api:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DRIGODB_API_TOKEN
              valueFrom:
                secretKeyRef: { name: drigodb-api-token, key: token }
            - name: DRIGODB_STORAGE_CLASS
              value: do-block-storage
            # The data-plane images every provisioned database runs. Pinned here
            # rather than left to the API's compiled-in defaults so the images in
            # production are the images recorded in git. The scheduled rebuild in
            # .github/workflows/images.yml opens a PR against these two lines.
            - name: DRIGODB_PG_IMAGE
              value: ghcr.io/drigolabs/drigodb-postgres:18-0.116-0
            - name: DRIGODB_GATEWAY_IMAGE
              value: ghcr.io/drigolabs/drigodb-gateway:0.116-0
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: drigodb-api
  namespace: drigodb-system
spec:
  type: ClusterIP
  selector: { app: drigodb-api }
  ports:
    - name: http
      port: 80
      targetPort: http
